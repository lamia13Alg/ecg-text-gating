data:
  eval_sets:
    lsas_external:
      cache: /tmp/cache_labels/lsas
      split: all
    mimic_internal:
      cache: /tmp/cache_labels/mimic
      split: test
    mimic_val:
      cache: /tmp/cache_labels/mimic
      split: val
    ptbxl_external:
      cache: /tmp/cache_local/ptbxl
      split: all
  max_train_records: null
  signal_norm: fixed
  text_policy: strict
  train_cache: /tmp/cache_labels/mimic
eval:
  min_pos: 10
  n_bootstrap: 200
  scenarios:
  - signal_only
  - limb6_signal_only
  - leadI_signal_only
model:
  d_model: 256
  dropout: 0.1
  fusion_layers: 2
  max_text_len: 96
  n_heads: 8
  signal_layers: 4
  text_encoder: light
  text_model_name: emilyalsentzer/Bio_ClinicalBERT
  text_trainable_layers: 2
output_dir: /kaggle/working/runs/L2_signal_seul
seed: 42
train:
  aux_weight: 0.3
  batch_size: 64
  class_weight_power: 0.5
  epochs: 20
  grad_clip: 1.0
  loss: asl
  loss_kwargs:
    clip: 0.05
    gamma_neg: 4.0
    gamma_pos: 0.0
  lr: 0.0003
  lr_text: 2.0e-05
  num_workers: 4
  p_drop_features: 0.2
  p_drop_leads: 0.3
  p_drop_text: 0.5
  patience: 4
  train_scenario: signal_only
  val_scenarios:
  - signal_only
  warmup_frac: 0.05
  weight_decay: 0.05
