# v2 : masquage strict du texte + abandon du texte plus fréquent. (Base : kaggle.yaml)
# Configuration pour Kaggle (GPU T4 16 Go, 4 CPU, ~29 Go de RAM).
# Les chemins sont surchargés depuis les notebooks avec --set.
seed: 42
output_dir: /kaggle/working/runs/fusion_v2

data:
  train_cache: /kaggle/working/cache/mimic
  eval_sets:
    mimic_internal: {cache: /kaggle/working/cache/mimic, split: test}
    mimic_val: {cache: /kaggle/working/cache/mimic, split: val}   # pour Platt / seuils / gating
    ptbxl_external: {cache: /kaggle/working/cache/ptbxl, split: all}
    lsas_external:  {cache: /kaggle/working/cache/lsas,  split: all}
  text_policy: strict    # v1 : masked
  max_train_records: null

model:
  d_model: 256
  signal_layers: 4
  fusion_layers: 2
  n_heads: 8
  dropout: 0.1
  text_encoder: hf
  text_model_name: emilyalsentzer/Bio_ClinicalBERT
  text_trainable_layers: 2
  max_text_len: 96

train:
  epochs: 20
  batch_size: 64
  num_workers: 4
  lr: 3.0e-4
  lr_text: 2.0e-5
  weight_decay: 0.05
  warmup_frac: 0.05
  grad_clip: 1.0
  patience: 4
  p_drop_text: 0.5       # v1 : 0.4
  p_drop_features: 0.2
  p_drop_leads: 0.3
  aux_weight: 0.3
  loss: asl
  loss_kwargs: {gamma_pos: 0.0, gamma_neg: 4.0, clip: 0.05}
  class_weight_power: 0.5
  val_scenarios: [full, no_text, signal_only]

eval:
  scenarios: [full, no_text, no_features, signal_only, text_only, features_only,
              limb6_no_text, leadI_no_text, leadsI+II_full]
  min_pos: 10
  n_bootstrap: 200
